[package]
name = "tq-controller"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
rmp-serde = "1"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
zmq = "0.10"
