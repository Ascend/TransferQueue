[package]
name = "tq-controller"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
indexmap = { version = "2", features = ["serde"] }
rmp = "0.8"
rmp-serde = "1"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
zmq = "0.10"
zmq-sys = "0.12"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
